<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="ct-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#111C30"/>
            <stop offset="100%" stop-color="#0B1120"/>
        </linearGradient>
        <linearGradient id="ct-accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#6366F1"/>
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="800" height="500" rx="16" fill="url(#ct-bg)"/>
    <rect x="1" y="1" width="798" height="498" rx="15" stroke="rgba(148, 163, 184, 0.18)" stroke-width="2"/>
    
    <!-- Top Browser Header Bar Mockup -->
    <rect x="24" y="24" width="752" height="40" rx="8" fill="#182642"/>
    <circle cx="50" cy="44" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="68" cy="44" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="86" cy="44" r="5" fill="#10B981" opacity="0.8"/>
    <rect x="110" y="34" width="320" height="20" rx="5" fill="#111C30"/>
    <text x="125" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">concerttix.local/events</text>
    <rect x="680" y="34" width="80" height="20" rx="5" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="696" y="48" fill="#38BDF8" font-family="Inter, sans-serif" font-size="11" font-weight="600">Ticket App</text>
    
    <!-- Hero Mockup inside screen -->
    <rect x="24" y="80" width="752" height="150" rx="12" fill="#152238" stroke="rgba(56, 189, 248, 0.2)"/>
    <text x="56" y="125" fill="#38BDF8" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">FEATURED EVENT PLATFORM</text>
    <text x="56" y="165" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="28" font-weight="700">ConcertTix Discovery</text>
    <text x="56" y="195" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Explore live concerts, compare Regular, VIP, and Platinum ticket classes.</text>
    
    <!-- Tier cards preview -->
    <rect x="24" y="250" width="235" height="180" rx="10" fill="#182642" stroke="rgba(148, 163, 184, 0.15)"/>
    <rect x="44" y="270" width="70" height="22" rx="4" fill="rgba(148, 163, 184, 0.2)"/>
    <text x="54" y="285" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="11" font-weight="600">REGULAR</text>
    <text x="44" y="325" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="18" font-weight="600">Festival Standing</text>
    <text x="44" y="350" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Standard access &amp; entry gate.</text>
    <rect x="44" y="380" width="100" height="28" rx="6" fill="#111C30"/>
    <text x="58" y="398" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Select Tier</text>
    
    <rect x="282" y="245" width="235" height="190" rx="10" fill="#1E2E4E" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="302" y="265" width="55" height="22" rx="4" fill="#38BDF8"/>
    <text x="316" y="280" fill="#0B1120" font-family="Inter, sans-serif" font-size="11" font-weight="700">VIP</text>
    <text x="302" y="320" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="18" font-weight="600">Priority Seating</text>
    <text x="302" y="345" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Exclusive lounge &amp; early entry.</text>
    <rect x="302" y="375" width="100" height="28" rx="6" fill="#38BDF8"/>
    <text x="320" y="393" fill="#0B1120" font-family="Inter, sans-serif" font-size="11" font-weight="600">Popular</text>
    
    <rect x="541" y="250" width="235" height="180" rx="10" fill="#182642" stroke="rgba(148, 163, 184, 0.15)"/>
    <rect x="561" y="270" width="85" height="22" rx="4" fill="rgba(129, 140, 248, 0.25)"/>
    <text x="571" y="285" fill="#A5B4FC" font-family="Inter, sans-serif" font-size="11" font-weight="600">PLATINUM</text>
    <text x="561" y="325" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="18" font-weight="600">All-Access Pass</text>
    <text x="561" y="350" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Meet &amp; greet, merchandise kit.</text>
    <rect x="561" y="380" width="100" height="28" rx="6" fill="#111C30"/>
    <text x="575" y="398" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Select Tier</text>

    <!-- Bottom Placeholder Notice Badge -->
    <rect x="24" y="452" width="752" height="26" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="240" y="469" fill="#38BDF8" font-family="Inter, sans-serif" font-size="11" font-weight="500">Preview Diagram / Placeholder — Real Application Screenshot to be supplied by owner</text>
</svg>
